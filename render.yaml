services:
  - type: web
    name: pixential-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma && npx prisma generate
    startCommand: npx prisma db push --skip-generate && node prisma/seed.js && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://pixential.netlify.app
      - key: FILE_STORE
        value: db
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
